name: Deploy GitHub Pages from PR comment

on:
  issue_comment:
    types: [created]

env:
  PAGES_WORKFLOW_ID: jekyll-gh-pages.yml

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  deploy:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'deploy: github-pages') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR head ref
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number
            });

            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              throw new Error("Deployment rejected: PR originates from a fork. Only branches in this repository can be deployed via PR comments.");
            }

            core.setOutput("ref", pr.head.ref);

      - name: Trigger Pages deployment workflow
        uses: actions/github-script@v7
        env:
          PAGES_WORKFLOW_ID: ${{ env.PAGES_WORKFLOW_ID }}
          PR_REF: ${{ steps.pr.outputs.ref }}
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: process.env.PAGES_WORKFLOW_ID,
              ref: process.env.PR_REF
            });
